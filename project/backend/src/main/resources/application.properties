# ================== Server ==================
server.port=7078

# ================== MySQL (production/dev) ==================
# Uncomment and configure to use MySQL as described in the paper's
# Coding Question Generator & Code Editor module (Section III-F).
# spring.datasource.url=jdbc:mysql://localhost:3306/ai_interview_db?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ================== H2 (default, zero-setup local run) ==================
spring.datasource.url=jdbc:h2:mem:ai_interview_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=saran@2005
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ================== LLM integration (Question Generation module) ==================
# Set this to point at your chosen LLM provider endpoint/key. When unset,
# the QuestionGenerationService falls back to a deterministic template-based
# generator so the app runs fully offline out of the box.
llm.api.url=
llm.api.key=

# ================== Adaptive Difficulty Controller (Eq. 3 in paper) ==================
adaptive.difficulty.min=1
adaptive.difficulty.max=5
adaptive.difficulty.target-threshold=0.6
adaptive.difficulty.learning-rate=2.0
